[package]
name = "gamesave-vault"
version = "4.0.0"
description = "GameSave Vault desktop backup manager"
authors = ["GameSave Vault contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "gamesave_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
